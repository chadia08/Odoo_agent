    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consultant Odoo AI</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        
        <style>
            :root {
                --bg: #faf9f7;
                --card: #ffffff;
                --text: #1a1a1a;
                --text-dim: #6b6b6b;
                --accent: #2c5f2d;
                --accent-light: #e8f4e8;
                --border: #e5e3df;
                --user-bubble: #2c5f2d;
                --ai-bubble: #f5f3ef;
            }
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'DM Sans', sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            
            .container {
                width: 100%;
                max-width: 720px;
                height: 85vh;
                background: var(--card);
                border-radius: 24px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.06);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border: 1px solid var(--border);
            }
            
            /* ═══ HEADER ═══ */
            .header {
                padding: 24px 28px;
                border-bottom: 1px solid var(--border);
                background: linear-gradient(135deg, #fdfcfb 0%, #f9f8f5 100%);
            }
            
            .header-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }
            
            .logo {
                font-family: 'Crimson Pro', serif;
                font-size: 22px;
                font-weight: 700;
                color: var(--accent);
                letter-spacing: -0.5px;
            }
            
            .status {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--text-dim);
            }
            
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #cbd5e0;
                transition: background 0.3s;
            }
            
            .status-dot.connected {
                background: #48bb78;
                box-shadow: 0 0 8px rgba(72,187,120,0.4);
            }
            
            .tagline {
                font-size: 13px;
                color: var(--text-dim);
                font-style: italic;
            }
            
            /* ═══ CHAT MESSAGES ═══ */
            .messages {
                flex: 1;
                overflow-y: auto;
                padding: 28px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            
            .messages::-webkit-scrollbar {
                width: 6px;
            }
            
            .messages::-webkit-scrollbar-track {
                background: transparent;
            }
            
            .messages::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 10px;
            }
            
            .message {
                display: flex;
                gap: 12px;
                animation: fadeIn 0.4s ease;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .message.user {
                flex-direction: row-reverse;
            }
            
            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                background: var(--accent-light);
            }
            
            .message.user .avatar {
                background: var(--user-bubble);
                color: white;
            }
            
            .bubble {
                max-width: 75%;
                padding: 14px 18px;
                border-radius: 18px;
                line-height: 1.6;
                font-size: 15px;
            }
            
            .message.ai .bubble {
                background: var(--ai-bubble);
                color: var(--text);
                border: 1px solid var(--border);
            }
            
            .message.user .bubble {
                background: var(--user-bubble);
                color: white;
            }
            
            /* Typing indicator */
            .typing {
                display: flex;
                gap: 4px;
                padding: 14px 18px;
            }
            
            .typing span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--text-dim);
                opacity: 0.4;
                animation: typing 1.4s infinite;
            }
            
            .typing span:nth-child(2) { animation-delay: 0.2s; }
            .typing span:nth-child(3) { animation-delay: 0.4s; }
            
            @keyframes typing {
                0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
                30% { transform: translateY(-10px); opacity: 1; }
            }
            
            /* ═══ INPUT AREA ═══ */
            .input-area {
                padding: 20px 28px;
                border-top: 1px solid var(--border);
                background: var(--card);
            }
            
            .input-wrapper {
                display: flex;
                gap: 12px;
                align-items: flex-end;
            }
            
            #userInput {
                flex: 1;
                padding: 14px 18px;
                border: 1.5px solid var(--border);
                border-radius: 16px;
                font-family: 'DM Sans', sans-serif;
                font-size: 15px;
                outline: none;
                resize: none;
                max-height: 120px;
                transition: border-color 0.2s;
                background: var(--bg);
            }
            
            #userInput:focus {
                border-color: var(--accent);
            }
            
            #sendBtn {
                width: 48px;
                height: 48px;
                border: none;
                background: var(--accent);
                color: white;
                border-radius: 14px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                transition: all 0.2s;
                flex-shrink: 0;
            }
            
            #sendBtn:hover {
                background: #234d24;
                transform: scale(1.05);
            }
            
            #sendBtn:active {
                transform: scale(0.95);
            }
            
            #sendBtn:disabled {
                background: var(--border);
                cursor: not-allowed;
                transform: none;
            }
            
            /* ═══ ANIMATIONS ═══ */
            .slide-in {
                animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            }
            
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="container slide-in">
            <!-- Header -->
            <div class="header">
                <div class="header-top">
                    <div class="logo">🌿 Consultant Odoo</div>
                    <div class="status">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">Connexion...</span>
                    </div>
                </div>
                <div class="tagline">Configuration intelligente par IA</div>
            </div>
            
            <!-- Messages -->
            <div class="messages" id="messagesContainer">
                <!-- Les messages s'afficheront ici -->
            </div>
            
            <!-- Input -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="Décrivez votre activité et vos besoins..."
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" disabled>→</button>
                </div>
            </div>
        </div>

        <script>
            // ═══════════════════════════════════════════════════════
            // CONFIG
            // ═══════════════════════════════════════════════════════
            const SESSION_ID = 'session_' + Math.random().toString(36).substr(2, 9);
            const WS_URL = `ws://${window.location.host}/ws/chat/${SESSION_ID}`;
            
            // ═══════════════════════════════════════════════════════
            // DOM
            // ═══════════════════════════════════════════════════════
            const messagesContainer = document.getElementById('messagesContainer');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            let ws = null;
            let isTyping = false;
            
            // ═══════════════════════════════════════════════════════
            // WEBSOCKET
            // ═══════════════════════════════════════════════════════
            function connectWebSocket() {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    console.log('✅ Connecté au serveur');
                    statusDot.classList.add('connected');
                    statusText.textContent = 'En ligne';
                    sendBtn.disabled = false;
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'ai_message') {
                        removeTypingIndicator();
                        addMessage(data.content, 'ai');
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('❌ Erreur WebSocket:', error);
                    statusText.textContent = 'Erreur de connexion';
                };
                
                ws.onclose = () => {
                    console.log('🔌 Déconnecté');
                    statusDot.classList.remove('connected');
                    statusText.textContent = 'Déconnecté';
                    sendBtn.disabled = true;
                };
            }
            
            // ═══════════════════════════════════════════════════════
            // MESSAGES
            // ═══════════════════════════════════════════════════════
            function addMessage(text, sender = 'ai') {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = sender === 'user' ? '👤' : '🤖';
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = text;
                
                msgDiv.appendChild(avatar);
                msgDiv.appendChild(bubble);
                
                messagesContainer.appendChild(msgDiv);
                scrollToBottom();
            }
            
            function addTypingIndicator() {
                if (isTyping) return;
                isTyping = true;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ai';
                msgDiv.id = 'typingIndicator';
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = '🤖';
                
                const typing = document.createElement('div');
                typing.className = 'typing bubble';
                typing.innerHTML = '<span></span><span></span><span></span>';
                
                msgDiv.appendChild(avatar);
                msgDiv.appendChild(typing);
                messagesContainer.appendChild(msgDiv);
                scrollToBottom();
            }
            
            function removeTypingIndicator() {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) {
                    indicator.remove();
                    isTyping = false;
                }
            }
            
            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // ═══════════════════════════════════════════════════════
            // SEND MESSAGE
            // ═══════════════════════════════════════════════════════
            function sendMessage() {
                const text = userInput.value.trim();
                if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
                
                // Affiche le message user
                addMessage(text, 'user');
                
                // Envoie au serveur
                ws.send(JSON.stringify({ message: text }));
                
                // Reset input
                userInput.value = '';
                userInput.style.height = 'auto';
                
                // Typing indicator
                addTypingIndicator();
            }
            
            // ═══════════════════════════════════════════════════════
            // EVENT LISTENERS
            // ═══════════════════════════════════════════════════════
            sendBtn.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            
            // ═══════════════════════════════════════════════════════
            // INIT
            // ═══════════════════════════════════════════════════════
            connectWebSocket();
        </script>
    </body>
    </html>
