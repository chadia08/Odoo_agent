<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Odoo Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-box { height: 70vh; scroll-behavior: smooth; }
        .typing-dot { animation: blink 1.4s infinite both; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
    </style>
</head>
<body class="bg-indigo-50 flex items-center justify-center h-screen">
    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-2xl flex flex-col overflow-hidden">
        <div class="bg-indigo-700 p-4 text-white flex justify-between items-center">
            <h1 class="font-bold tracking-wide">Assistant Configuration Odoo</h1>
            <div id="status" class="text-xs bg-indigo-800 px-3 py-1 rounded-full">Hors ligne</div>
        </div>

        <div id="chat-box" class="chat-box p-6 overflow-y-auto flex flex-col gap-4 bg-gray-50">
            <div class="bg-white border p-3 rounded-lg self-start shadow-sm max-w-[85%]">
                Bonjour ! Je vais vous aider à configurer votre instance Odoo. Quel module souhaitez-vous paramétrer : Sales, CRM ou Facturation ?
            </div>
        </div>

        <div id="loading" class="hidden px-6 py-2 text-xs text-gray-400 italic">L'agent analyse votre demande...</div>

        <div class="p-4 border-t bg-white flex gap-2">
            <input type="text" id="user-input" class="flex-1 p-3 rounded-xl bg-gray-100 outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Votre réponse ici...">
            <button id="send-btn" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Envoyer</button>
        </div>
    </div>

    <script>
        const sessionId = "session_" + Math.random().toString(36).substr(2, 9);
        const ws = new WebSocket(`ws://${window.location.host}/ws/chat/${sessionId}`);
        const chatBox = document.getElementById('chat-box');
        const loader = document.getElementById('loading');
        const userInput = document.getElementById('user-input');

        ws.onopen = () => {
            const st = document.getElementById('status');
            st.innerText = "Connecté"; st.className = "text-xs bg-green-500 px-3 py-1 rounded-full text-white";
        };

        ws.onmessage = (e) => {
            loader.classList.add('hidden');
            const data = JSON.parse(e.data);
            if(data.type === 'ai_answer') addMsg(data.text, 'ai');
        };

        function addMsg(text, side) {
            const div = document.createElement('div');
            div.className = side === 'user' 
                ? 'self-end bg-indigo-600 text-white p-3 rounded-2xl shadow-md max-w-[85%]' 
                : 'self-start bg-white border border-gray-200 p-3 rounded-2xl shadow-sm max-w-[85%]';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function send() {
            const val = userInput.value.trim();
            if(val) {
                addMsg(val, 'user');
                ws.send(JSON.stringify({ text: val }));
                userInput.value = '';
                loader.classList.remove('hidden');
            }
        }

        document.getElementById('send-btn').onclick = send;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
